spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD}
      database: 6
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-wait: 2000ms
          max-idle: 8
          min-idle: 2
logging:
  level:
    com.cloud.gateway: debug
    org.springframework.cloud.gateway: debug
    org.springframework.security: warn
    org.springframework.web: warn
    com.alibaba.nacos: warn
app:
  security:
    api-docs-enabled: true
    enable-test-api: true
    signature:
      secret: ${GATEWAY_SIGNATURE_SECRET:cloud-gateway-signature-dev}
    internal-identity:
      secret: ${GATEWAY_INTERNAL_IDENTITY_SECRET:${GATEWAY_SIGNATURE_SECRET:cloud-gateway-signature-dev}}
    internal-hmac:
      secret: ${app.security.internal-identity.secret:${GATEWAY_INTERNAL_IDENTITY_SECRET:${app.security.signature.secret:${GATEWAY_SIGNATURE_SECRET:cloud-gateway-signature-dev}}}}






